<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl Vault</title>
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Oversikt over vinylsamlingen: hva du eier, hva du mangler og hvor komplett hver artist er.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23111'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23333' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23333' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23f5a524'/%3E%3Ccircle cx='32' cy='32' r='2' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
<style>
/* Vinyl Vault v1.2.0 – se CHANGELOG.md */
:root{
  --bg:#0b0d12; --bg2:#12151d;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#eef1f6; --muted:#9aa3b2; --dim:#6b7383;
  --accent:#f5a524; --accent2:#ff6b3d; --ok:#34d399; --miss:#f87171; --fav:#f472b6; --wish:#a78bfa;
  --r:18px; --r2:12px;
  --head:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  --nav-h:68px; --side-w:232px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);overflow-x:hidden}
/* bakgrunnsglød for glasseffekten */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38}
.bgfx i:nth-child(1){width:520px;height:520px;background:#f5a524;top:-180px;right:-160px;opacity:.22}
.bgfx i:nth-child(2){width:460px;height:460px;background:#7c3aed;bottom:-160px;left:-160px;opacity:.25}
.bgfx i:nth-child(3){width:340px;height:340px;background:#0ea5e9;top:40%;left:45%;opacity:.12}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}

/* ---------- ramme ---------- */
.side{display:none}
main{padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:700 1.2rem var(--head);letter-spacing:-.01em;text-decoration:none}
.brand .disc{width:30px;height:30px;flex:none;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar .brand{display:flex}
.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;height:var(--nav-h);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:22px;background:rgba(18,21,29,.72)}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;border-radius:16px;
  color:var(--muted);font-size:.7rem;font-weight:600;text-decoration:none;transition:color .2s,background .2s}
.navbtn svg{width:22px;height:22px}
.navbtn.on{color:var(--ink);background:var(--glass2)}
.navbtn.on svg{color:var(--accent)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));z-index:41;
  width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1005;
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(245,165,36,.35);transition:transform .2s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}
@media (min-width:900px){
  .bottom,.topbar .brand{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;top:16px;bottom:16px;left:16px;width:var(--side-w);padding:20px 14px;z-index:30}
  .side .brand{margin:0 8px 18px}
  .side .navbtn{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:.92rem}
  .side .sep{height:1px;background:var(--line);margin:10px 8px}
  .side .foot{margin-top:auto;padding:0 10px;color:var(--dim);font-size:.75rem}
  main{padding:28px 32px 64px calc(var(--side-w) + 52px)}
  .fab{bottom:32px;right:32px}
}

/* ---------- typografi og felles ---------- */
h1,h2,h3{font-family:var(--head);letter-spacing:-.02em;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1}
h2{font-size:1.2rem}
.sub{color:var(--muted);margin:4px 0 0}
.view{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:fadeup .4s ease both;animation-delay:calc(min(var(--i,0),16) * 30ms)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.section{margin-top:26px}
.section>.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.link{color:var(--accent);background:none;border:0;padding:0;font-weight:600;text-decoration:none;font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);
  background:var(--glass2);font-weight:600;font-size:.9rem;text-decoration:none;transition:background .2s,transform .1s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1005;border-color:transparent}
.btn.danger{color:#fecaca;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}
.btn svg{width:18px;height:18px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:.82rem;font-weight:500;color:var(--muted);transition:all .2s}
.chip.on{color:var(--ink);border-color:var(--accent);background:rgba(245,165,36,.15)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.5;margin-bottom:10px}

/* ---------- verktøylinje (søk/sortering) ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.search{flex:1 1 260px;position:relative}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:46px;padding:0 14px 0 42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);outline:none}
.search input:focus{border-color:var(--accent)}
select.sel{height:46px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);min-width:0}
.seg{display:inline-flex;padding:4px;border-radius:14px;border:1px solid var(--line);background:var(--glass);height:46px}
.seg button{border:0;background:none;padding:0 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.85rem}
.seg button.on{background:var(--glass2);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none}

/* ---------- statistikk ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.stats{grid-template-columns:repeat(6,1fr)}}
.stat{padding:16px}
.stat .k{color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font:700 1.75rem/1.15 var(--head);margin-top:6px}
.stat .v small{font-size:.9rem;color:var(--muted);font-weight:500}
.stat.hl{background:linear-gradient(135deg,rgba(245,165,36,.22),rgba(255,107,61,.12));border-color:rgba(245,165,36,.35)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.full i{background:linear-gradient(90deg,#34d399,#10b981)}
.charts{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){.charts{grid-template-columns:1fr 1fr}}
.chartbox{padding:16px}
.chartbox h3{font-size:.95rem;margin-bottom:10px}
.chartbox .cv{position:relative;height:240px}
.nochart{color:var(--muted);font-size:.85rem;padding:20px 0}

/* ---------- artistkort ---------- */
.agrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.agrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1200px){.agrid{grid-template-columns:repeat(3,1fr)}}
.acard{display:flex;gap:14px;align-items:center;padding:14px;text-decoration:none;transition:transform .2s,border-color .2s,background .2s}
.acard:hover{transform:translateY(-2px);border-color:var(--line2);background:var(--glass2)}
.mosaic{width:78px;height:78px;flex:none;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.mosaic>div{position:relative;overflow:hidden}
.acard .info{flex:1;min-width:0}
.acard h3{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.acard .pct{font-weight:700;color:var(--ink)}
.acard .pct.full{color:var(--ok)}

/* ---------- albumkort ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1300px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{position:relative;padding:8px 8px 12px;text-decoration:none;display:block;transition:transform .25s,background .25s,border-color .25s}
.card:hover{transform:translateY(-4px);background:var(--glass2);border-color:var(--line2)}
.cover{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.cover>svg,.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card.missing .cover>svg,.card.missing .cover>img{filter:grayscale(.85) brightness(.6)}
.card .t{margin:10px 4px 0;font-weight:600;font-size:.92rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .y{margin:2px 4px 0;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  display:grid;place-items:center;font-size:1.05rem;background:rgba(10,12,16,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s}
.status:active{transform:scale(.85)}
.status.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.badges{position:absolute;left:14px;top:14px;z-index:2;display:flex;gap:4px}
.badges span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(10,12,16,.6);font-size:.75rem;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ---------- artist detalj ---------- */
.hero{position:relative;overflow:hidden;padding:20px;margin-bottom:20px}
.hero .glow{position:absolute;inset:-40%;filter:blur(60px);opacity:.35;z-index:-1}
.hero-in{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.ring{width:110px;height:110px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font:700 1.5rem var(--head)}
.hero .txt{flex:1 1 220px;min-width:0}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:600;margin-bottom:12px;background:none;border:0;padding:0}
.crumb svg{width:16px;height:16px}

/* ---------- album detalj ---------- */
.album{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:900px){.album{grid-template-columns:minmax(280px,420px) 1fr;align-items:start}}
.album .bigcover{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55)}
.album .bigcover>svg,.album .bigcover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.album .bigcover.missing>svg,.album .bigcover.missing>img{filter:grayscale(.8) brightness(.65)}
@media (min-width:900px){.album .left{position:sticky;top:28px}}
.album .artist{color:var(--accent);font-weight:600;text-decoration:none}
.toggle{display:flex;gap:8px;margin:16px 0}
.toggle button{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-weight:600;color:var(--muted);transition:all .2s}
.toggle button.on.own{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.55);color:#a7f3d0}
.toggle button.on.miss{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.5);color:#fecaca}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.facts{grid-template-columns:repeat(3,1fr)}}
.fact{padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.fact .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fact .v{font-weight:600;margin-top:2px;word-break:break-word}
.panel{padding:16px;margin-top:14px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tracks{list-style:none;margin:0;padding:0;counter-reset:t}
.tracks li{counter-increment:t;display:flex;gap:14px;padding:10px 6px;border-bottom:1px solid var(--line);align-items:baseline}
.tracks li:last-child{border-bottom:0}
.tracks li::before{content:counter(t);min-width:22px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:.85rem}
.notes{white-space:pre-wrap;color:var(--ink)}
.muted{color:var(--muted)}
textarea.ta{width:100%;min-height:160px;padding:12px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);resize:vertical;outline:none;line-height:1.5}
textarea.ta:focus{border-color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;font-size:1.15rem;transition:all .2s}
.iconbtn.on{border-color:var(--fav);background:rgba(244,114,182,.15)}
.iconbtn.wish.on{border-color:var(--wish);background:rgba(167,139,250,.16)}

/* ---------- lister (mangler/ønsker/siste) ---------- */
.group{padding:14px 14px 6px;margin-bottom:12px}
.group h3{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem;margin:0 4px 8px}
.group h3 a{text-decoration:none}
.group h3 small{color:var(--muted);font:500 .8rem var(--body)}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:1px solid var(--line);text-decoration:none}
.row:first-of-type{border-top:0}
.row .thumb{width:48px;height:48px;flex:none;border-radius:8px;overflow:hidden;position:relative;background:#111}
.row .thumb>svg,.row .thumb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt span{color:var(--muted);font-size:.82rem}
.row .end{color:var(--muted);font-size:.85rem;white-space:nowrap}
.rowbtn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;font-size:.95rem}
.rank{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);text-decoration:none}
.rank:first-of-type{border-top:0}
.rank .no{width:26px;color:var(--dim);font:700 .95rem var(--head)}
.rank .nm{flex:1;min-width:0}
.rank .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .bar{margin-top:6px}
.rank .p{font:700 1rem var(--head);min-width:48px;text-align:right}
.two{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hscroll .card{flex:0 0 150px;scroll-snap-align:start}
@media (min-width:640px){.hscroll .card{flex-basis:170px}}

/* ---------- mer-side ---------- */
.menu{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.menu{grid-template-columns:repeat(2,1fr)}}
.mitem{display:flex;align-items:center;gap:14px;padding:16px;text-decoration:none;transition:background .2s}
.mitem:hover{background:var(--glass2)}
.mitem .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--glass2)}
.mitem b{display:block}
.mitem span{color:var(--muted);font-size:.85rem}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  border-radius:24px 24px 0 0;background:rgba(20,23,32,.92);border:1px solid var(--line2);animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;padding:24px}}
.sheet h2{margin-bottom:14px}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.28);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:130px;resize:vertical;line-height:1.45}
.field .hint{font-size:.75rem;color:var(--dim);margin-top:4px}
.field.err input{border-color:var(--miss)}
.ownpick{display:flex;gap:8px}
.ownpick label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.2);font-weight:600;text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--muted);margin:0;cursor:pointer}
.ownpick input{position:absolute;opacity:0;pointer-events:none}
.ownpick input:checked+label.o{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.15);color:#a7f3d0}
.ownpick input:checked+label.m{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.13);color:#fecaca}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.prev{display:flex;gap:12px;align-items:center}
.prev .cover{width:72px;flex:none;border-radius:10px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.newartist{display:none;margin-top:8px}
.newartist.on{display:block}

/* ---------- lås og lagring ---------- */
body.ro .edit-only{display:none!important}
body.ro .status{pointer-events:none}
.lockbar{display:flex;align-items:center;gap:8px}
.lockbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);
  background:var(--glass);font-weight:600;font-size:.82rem;color:var(--muted);white-space:nowrap}
.lockbtn.on{color:#a7f3d0;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.12)}
.sync{font-size:.75rem;color:var(--muted);white-space:nowrap;background:none;border:0;padding:0}
.sync.ok{color:var(--ok)} .sync.err{color:var(--miss);text-decoration:underline}
.side .lockbar{flex-direction:column;align-items:stretch;margin:0 4px 14px}
.side .lockbtn{justify-content:center}
.side .sync{text-align:center}
@media (min-width:900px){#lockTop{display:none}.topbar{margin:0}}
.steps{margin:0 0 14px;padding-left:20px;color:var(--muted)} .steps li{margin:5px 0} .steps b{color:var(--ink)}
.steps a{color:var(--accent)}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.loading .disc{width:56px;height:56px;margin-bottom:12px}

/* ---------- henting fra MusicBrainz ---------- */
.pick{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin:0 -4px;padding:0 4px}
.pick .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:left;width:100%}
.pick .opt:hover{border-color:var(--accent)}
.pick .opt b{display:block}
.pick .opt span{color:var(--muted);font-size:.82rem}
.pick h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 4px 2px;display:flex;justify-content:space-between;align-items:center}
.pick h3 button{font-size:.8rem;text-transform:none;letter-spacing:0}
.pick label.opt{cursor:pointer}
.pick label.opt input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.pick label.opt.have{opacity:.5;cursor:default}
.pick .th{width:44px;height:44px;flex:none;border-radius:6px;overflow:hidden;position:relative;background:#111}
.pick .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
.src{font-size:.75rem;color:var(--dim);margin-top:10px}
.src a{color:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;
  padding:12px 18px;border-radius:14px;background:rgba(30,34,46,.95);border:1px solid var(--line2);font-weight:500;font-size:.9rem;
  box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toast .3s ease;max-width:calc(100vw - 32px)}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}}
@media (min-width:900px){.toast{bottom:32px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

"use strict";
/* =====================================================================
   Vinyl Vault v1.2.0
   Én fil, ingen egen server. Samlingen ligger i collection.json i GitHub-repoet:
   alle kan lese den, men bare den som har en GitHub-nøkkel med skrivetilgang kan endre den.
   ===================================================================== */
const APP_VERSION = "1.2.0";
const STORE_KEY = "vinylVault.data.v1";      // v1.0.0: samlingen lå bare her (flyttes til GitHub ved opplåsing)
const BACKUP_KEY = "vinylVault.backup.v1";
const CACHE_KEY = "vinylVault.cache.v2";      // siste kjente samling, vises straks ved oppstart
const TOKEN_KEY = "vinylVault.token";         // GitHub-nøkkelen (bare på enheter som er låst opp)
const SYNC_KEY = "vinylVault.sync";           // { sha, dirty } – hva GitHub har og om noe er ulagret

const CONDITIONS = ["Mint (M)","Near Mint (NM)","Very Good Plus (VG+)","Very Good (VG)","Good Plus (G+)","Good (G)","Fair (F)","Poor (P)"];

/* ---------- hjelpere ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const nok = n => new Intl.NumberFormat("nb-NO", { style: "currency", currency: "NOK", maximumFractionDigits: 0 }).format(n || 0);
const fmtDate = d => { if (!d) return ""; const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("nb-NO", { day: "numeric", month: "short", year: "numeric" }); };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const byName = (a, b) => a.localeCompare(b, "nb", { sensitivity: "base" });
const sortName = s => String(s).replace(/^(the|a|an)\s+/i, "");   // «The Wall» sorteres under W
function hash(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- cover: eget bilde hvis URL, ellers generert vinylcover ---------- */
function coverSvg(al, artistName){
  const h = hash(al.title + "|" + artistName), hue = h % 360, hue2 = (hue + 40 + (h >> 8) % 80) % 360;
  const label = `hsl(${(hue + 180) % 360} 70% 55%)`;
  const title = esc(al.title.length > 26 ? al.title.slice(0, 25) + "…" : al.title);
  const art = esc(artistName.length > 30 ? artistName.slice(0, 29) + "…" : artistName);
  const gid = "g" + h.toString(36);
  return `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue} 55% 32%)"/><stop offset="1" stop-color="hsl(${hue2} 60% 14%)"/></linearGradient></defs>
    <rect width="200" height="200" fill="url(#${gid})"/>
    <circle cx="150" cy="100" r="78" fill="#0c0c0c"/>
    <g fill="none" stroke="#222" stroke-width="1.2"><circle cx="150" cy="100" r="68"/><circle cx="150" cy="100" r="58"/><circle cx="150" cy="100" r="48"/><circle cx="150" cy="100" r="38"/></g>
    <circle cx="150" cy="100" r="24" fill="${label}"/><circle cx="150" cy="100" r="3" fill="#0c0c0c"/>
    <rect x="0" y="0" width="112" height="200" fill="url(#${gid})"/>
    <rect x="0" y="0" width="112" height="200" fill="rgba(0,0,0,.12)"/>
    <text x="12" y="150" fill="#fff" font-family="Space Grotesk,system-ui,sans-serif" font-weight="700" font-size="13">${title}</text>
    <text x="12" y="168" fill="rgba(255,255,255,.7)" font-family="Inter,system-ui,sans-serif" font-size="9.5">${art}</text>
    <text x="12" y="26" fill="rgba(255,255,255,.55)" font-family="Space Grotesk,system-ui,sans-serif" font-weight="700" font-size="10" letter-spacing="2">${esc(al.year || "")}</text>
  </svg>`;
}
function coverHtml(al){
  const name = artistName(al.artistId);
  const img = isUrl(al.cover) ? `<img src="${esc(al.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
  return coverSvg(al, name) + img;
}
const isUrl = s => /^(https?:\/\/|data:image\/)/i.test(String(s || "").trim());

/* =====================================================================
   DATA
   ===================================================================== */
let db = { version: 1, artists: [], albums: [] };

function blankAlbum(p = {}){
  return {
    id: p.id || uid(), artistId: p.artistId || "", title: String(p.title || "").trim(), year: p.year ? Number(p.year) || null : null,
    genre: String(p.genre || "").trim(), cover: String(p.cover || "").trim(),
    tracks: Array.isArray(p.tracks) ? p.tracks.map(t => String(t).trim()).filter(Boolean) : [],
    owned: !!p.owned, favorite: !!p.favorite, wishlist: !!p.wishlist,
    price: p.price === "" || p.price == null || isNaN(Number(p.price)) ? null : Number(p.price),
    condition: String(p.condition || ""), purchaseDate: /^\d{4}-\d{2}-\d{2}$/.test(p.purchaseDate || "") ? p.purchaseDate : "",
    notes: String(p.notes || ""), added: p.added || new Date().toISOString(),
    rgid: /^[0-9a-f-]{36}$/.test(p.rgid || "") ? p.rgid : "",   // MusicBrainz release group (for cover og trackliste)
  };
}

function validate(d){
  if (!d || typeof d !== "object" || !Array.isArray(d.artists) || !Array.isArray(d.albums)) throw new Error("Filen er ikke en Vinyl Vault-samling.");
  const artists = d.artists.filter(a => a && a.id && String(a.name || "").trim()).map(a => ({ id: String(a.id), name: String(a.name).trim(), notes: String(a.notes || ""), mbid: /^[0-9a-f-]{36}$/.test(a.mbid || "") ? a.mbid : "" }));
  const ids = new Set(artists.map(a => a.id));
  const albums = d.albums.filter(a => a && a.title && ids.has(String(a.artistId))).map(a => blankAlbum({ ...a, id: String(a.id || uid()), artistId: String(a.artistId) }));
  return { version: 1, artists, albums };
}
const ls = {

  set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};

const canEdit = () => !!token;
let sync = (() => { try{ return JSON.parse(ls.get(SYNC_KEY) || "{}") || {}; }catch(e){ return {}; } })();
const saveSync = () => ls.set(SYNC_KEY, JSON.stringify(sync));
let loadState = "loading", loadError = "", syncState = "", syncMsg = "", changeNo = 0;

function readCache(){ try{ const raw = ls.get(CACHE_KEY); return raw ? validate(JSON.parse(raw)) : null; }catch(e){ return null; } }
function writeCache(){ if (!ls.set(CACHE_KEY, JSON.stringify(db))) toast("Klarte ikke å lagre på enheten (fullt lager?)"); }
const fileText = d => JSON.stringify({ app: "Vinyl Vault", appVersion: APP_VERSION, updated: new Date().toISOString(), version: 1, artists: d.artists, albums: d.albums }, null, 2) + "\n";

function sig(d){
  const nm = id => (d.artists.find(a => a.id === id) || {}).name || "";
  return JSON.stringify(d.albums.map(a => [nm(a.artistId), a.title, a.year, a.genre, a.cover, a.tracks, a.owned, a.favorite, a.wishlist, a.price, a.condition, a.purchaseDate, a.notes]).sort()

}

/* ---------- GitHub ---------- */
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
function ghHeaders(t = token){ const h = { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; if (t) h.Authorization = "Bearer " + t; return h; }
function b64encode(str){ const b = new TextEncoder().encode(str); let out = ""; for (let i = 0; i < b.length; i += 0x8000) out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(out); }
function b64decode(b64){ const x = atob(String(b64).replace(/\s/g, "")); const b = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) b[i] = x.charCodeAt(i); return new TextDecoder().decode(b); }
async function httpErr(r){
  let m = ""; try{ m = (await r.json()).message || ""; }catch(e){}
  const e = new Error(
    r.status === 401 ? "GitHub-nøkkelen er ugyldig eller utløpt. Lås opp på nytt med en ny nøkkel." :
    r.status === 403 && /rate limit/i.test(m) ? "GitHub har midlertidig sperret for mange forespørsler. Prøv igjen om litt." :
    r.status === 403 ? "Nøkkelen mangler skrivetilgang. Den må ha «Contents: Read and write» for Vinyl-Vault.io." :
    r.status === 404 ? "Nøkkelen har ikke tilgang til repoet Vinyl-Vault.io." : `GitHub svarte ${r.status}${m ? ": " + m : ""}`);
  e.status = r.status; e.auth = r.status === 401; e.msg = m;
  return e;
}
/* Henter samlingen: { data, sha } – data er null hvis filen ikke finnes ennå */
async function fetchRemote(){
  let r;
  try{ r = await fetch(`${API}/contents/${GH.path}?ref=${GH.branch}`, { headers: ghHeaders(), cache: "no-store" }); }catch(e){ r = null; }
  if (r && r.status === 404 && !canEdit()) r = null;              // prøv også Pages-kopien
  if (r && r.status === 404) return { data: null, sha: null, missing: true };
  if (r && r.status === 401 && canEdit()) throw await httpErr(r);
  if (r && r.ok){ const j = await r.json(); return { data: validate(JSON.parse(b64decode(j.content))), sha: j.sha }; }
  // reserve: filen slik GitHub Pages serverer den (kan være noen minutter gammel)
  const p = await fetch(`./${GH.path}?t=${Date.now()}`, { cache: "no-store" });
  if (p.status === 404) return { data: null, sha: null, missing: true };
  if (!p.ok) throw new Error("Fikk ikke hentet samlingen (" + p.status + ").");
  return { data: validate(await p.json()), sha: null, fromPages: true };
}

async function load(){
  const cached = readCache();
  if (cached){ db = cached; loadState = "ok"; }
  route();
  try{
    const rem = await fetchRemote();
    if (canEdit() && sync.dirty && cached){
      // endringer på denne enheten ble ikke lastet opp sist
      if (rem.missing || !rem.sha || rem.sha === sync.sha){ loadState = "ok"; refresh(); save(); return; }
      const mine = await confirmBox("Ulagrede endringer", "Denne enheten har endringer som ikke ble lagret, og samlingen på nettet er endret siden. Vil du beholde endringene fra denne enheten?", "Behold mine", false, "Bruk den på nettet");
      if (mine){ sync.sha = rem.sha; saveSync(); loadState = "ok"; refresh(); save(); return; }
    }
    if (rem.data) db = rem.data; else if (!cached) db = seed();
    if (rem.sha) sync.sha = rem.sha;
    sync.dirty = false; saveSync(); writeCache(); loadState = "ok";
    if (canEdit() && rem.missing) save();                          // første lagring lager filen
  }catch(e){
    if (e.auth){ lockOut(e.message); return load(); }
    if (loadState === "ok") toast("Viser lagret kopi – fikk ikke kontakt med GitHub");
    else { loadState = "error"; loadError = e.message; }
  }
  refresh();
}

/* Lagrer på enheten straks, og til GitHub litt etter siste endring (så mange klikk blir én lagring) */
let pushT = null, pushing = false, pushAgain = false;
function save(){
  writeCache();
  if (!canEdit()) return;
  changeNo++; sync.dirty = true; saveSync(); setSync("saving");
  clearTimeout(pushT); pushT = setTimeout(pushNow, 1500);
}
async function pushNow(){
  clearTimeout(pushT);
  if (!canEdit() || !sync.dirty) return;
  if (pushing){ pushAgain = true; return; }
  pushing = true; setSync("saving");
  const n = changeNo;
  try{
    if (!sync.sha){
      const g = await fetch(`${API}/contents/${GH.path}?ref=${GH.branch}`, { headers: ghHeaders(), cache: "no-store" });
      if (g.ok) sync.sha = (await g.json()).sha; else if (g.status !== 404) throw await httpErr(g);
    }
    const body = { message: "Oppdater samling (Vinyl Vault " + APP_VERSION + ")", content: b64encode(fileText(db)), branch: GH.branch };
    if (sync.sha) body.sha = sync.sha;
    const r = await fetch(`${API}/contents/${GH.path}`, { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok){
      const e = await httpErr(r);
      if (r.status === 409 || (r.status === 422 && /sha/i.test(e.msg))) { await conflict(); return; }
      throw e;
    }
    sync.sha = (await r.json()).content.sha;
    if (changeNo === n) sync.dirty = false; else pushAgain = true;
    saveSync(); setSync(sync.dirty ? "saving" : "ok");
  }catch(e){
    if (e.auth) lockOut(e.message);
    else setSync("error", e.message || "Ingen kontakt med GitHub");
  }finally{
    pushing = false;
    if (pushAgain){ pushAgain = false; if (sync.dirty && canEdit()) pushNow(); }
  }
}
/* GitHub har en nyere versjon enn den denne enheten bygde på */
async function conflict(){
  let rem;
  try{ rem = await fetchRemote(); }catch(e){ setSync("error", e.message); return; }
  const mine = await confirmBox("Samlingen er endret et annet sted", "Det er lagret en nyere versjon fra en annen enhet. Vil du overskrive den med det du har her?", "Overskriv", false, "Bruk den nyeste");
  sync.sha = rem.sha;
  if (mine) { saveSync(); pushAgain = true; return; }
  if (rem.data) db = rem.data;
  sync.dirty = false; saveSync(); writeCache(); setSync("ok"); refresh();
}
function setSync(state, msg = ""){ syncState = state; syncMsg = msg; drawLock(); }

/* ---------- lås ---------- */
function lockHtml(){
  const st = !canEdit() ? "" :
    syncState === "error" ? `<button class="sync err" data-act="retrySync" title="${esc(syncMsg)}">⚠️ Ikke lagret – prøv igjen</button>` :
    syncState === "saving" ? '<span class="sync">Lagrer…</span>' : syncState === "ok" ? '<span class="sync ok">✓ Lagret på GitHub</span>' : "";
  return st + `<button class="lockbtn${canEdit() ? " on" : ""}" data-act="lock" aria-label="${canEdit() ? "Redigering er på. Trykk for å låse" : "Lås opp redigering"}">${canEdit() ? "🔓 Redigerer" : "🔒 Lås opp"}</button>`;
}
function drawLock(){
  document.body.classList.toggle("ro", !canEdit());
  const h = lockHtml();
  ["#lockTop", "#sideLock"].forEach(id => { const el = $(id); if (el) el.innerHTML = h; });
}
function lockOut(msg){ token = ""; ls.del(TOKEN_KEY); clearTimeout(pushT); syncState = ""; toast(msg || "🔒 Redigering er låst"); drawLock(); refresh(); }

async function verifyToken(t){
  let r;
  try{ r = await fetch(API, { headers: ghHeaders(t), cache: "no-store" }); }catch(e){ throw new Error("Fikk ikke kontakt med GitHub. Sjekk nettet."); }
  if (!r.ok) throw await httpErr(r);
  const j = await r.json();
  if (j.permissions && j.permissions.push === false) throw new Error("Brukeren bak nøkkelen har ikke skrivetilgang til repoet.");
}
function unlockForm(){
  openModal(`<h2>🔒 Lås opp redigering</h2>
    <p class="muted">Alle kan se samlingen. For å endre den trenger du en GitHub-nøkkel med skrivetilgang til repoet. Nøkkelen lagres bare på denne enheten.</p>
    <ol class="steps">
      <li>Åpne <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → ny fine-grained token</a></li>
      <li>Repository access: <b>Only select repositories</b> → <b>Vinyl-Vault.io</b></li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
      <li>Trykk <b>Generate token</b>, kopier og lim inn her</li>
    </ol>
    <form class="form" id="tf" novalidate><div class="field full"><label for="tok">GitHub-nøkkel</label>
      <input id="tok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"></div></form>
    <p class="muted" id="tokMsg" role="alert" style="min-height:1.4em;margin:8px 0 0"></p>
    <div class="acts"><button class="btn" data-close>Avbryt</button><button class="btn pri" form="tf" type="submit" id="tokBtn">Lås opp</button></div>`,
  (m, close) => {
    const msg = m.querySelector("#tokMsg"), btn = m.querySelector("#tokBtn");
    m.querySelector("#tf").onsubmit = async e => {
      e.preventDefault();
      const t = m.querySelector("#tok").value.trim();
      if (!t) { msg.textContent = "Lim inn nøkkelen først."; return; }
      btn.disabled = true; msg.style.color = ""; msg.textContent = "Sjekker nøkkelen…";
      try{
        await verifyToken(t);
        token = t; ls.set(TOKEN_KEY, t); close(); drawLock();
        toast("🔓 Redigering er slått på for denne enheten");
        await afterUnlock();
      }catch(err){ msg.style.color = "var(--miss)"; msg.textContent = err.message; btn.disabled = false; }
    };
  });
}
async function afterUnlock(){
  let rem;
  try{ rem = await fetchRemote(); }catch(e){ if (e.auth) return lockOut(e.message); toast(e.message); return; }
  sync.sha = rem.sha; sync.dirty = false; saveSync();
  if (rem.data) db = rem.data;
  // samling fra v1.0.0 som bare lå på denne enheten
  let legacy = null; try{ const raw = ls.get(STORE_KEY); legacy = raw ? validate(JSON.parse(raw)) : null; }catch(e){}
  if (legacy){
    ls.set(BACKUP_KEY, JSON.stringify({ date: new Date().toISOString(), app: APP_VERSION, data: legacy }));
    ls.del(STORE_KEY);
    const same = sig(legacy) === sig(rem.data || seed());
    if (!same && legacy.albums.length){
      const up = await confirmBox("Samling fra før på denne enheten", `Denne enheten har en samling fra før (${legacy.artists.length} artister, ${legacy.albums.length} album). Vil du laste den opp og erstatte samlingen på nettet?`, "Last opp", false, "Nei, bruk den på nettet");
      if (up){ db = legacy; save(); refresh(); return; }
    }
  }
  writeCache(); refresh();
  if (rem.missing) save(); else setSync("ok");
}

/* ---------- oppslag og statistikk ---------- */
const artist = id => db.artists.find(a => a.id === id);
const album = id => db.albums.find(a => a.id === id);
const artistName = id => (artist(id) || {}).name || "Ukjent artist";
const albumsOf = id => db.albums.filter(a => a.artistId === id).sort((a, b) => (a.year || 9999) - (b.year || 9999) || byName(a.title, b.title));
function artistStats(id){
  const l = albumsOf(id), own = l.filter(a => a.owned).length;
  return { total: l.length, own, miss: l.length - own, pct: pct(own, l.length) };
}
function totals(){
  const own = db.albums.filter(a => a.owned);
  return { artists: db.artists.length, total: db.albums.length, own: own.length, miss: db.albums.length - own.length,
    pct: pct(own.length, db.albums.length), value: own.reduce((s, a) => s + (a.price || 0), 0) };
}
const sortedArtists = () => [...db.artists].sort((a, b) => byName(sortName(a.name), sortName(b.name)));

/* ---------- endringer ---------- */
function setOwned(id, owned){
  const a = album(id); if (!a) return;
  a.owned = owned; if (owned) a.wishlist = false;
  save(); toast(owned ? `✅ ${a.title} – i samlingen` : `❌ ${a.title} – markert som mangler`);
}
function toggleFlag(id, key){
  const a = album(id); if (!a) return; a[key] = !a[key]; save();
  toast(key === "favorite" ? (a.favorite ? "❤️ Lagt til i favoritter" : "Fjernet fra favoritter") : (a.wishlist ? "⭐ Lagt på ønskelisten" : "Fjernet fra ønskelisten"));
}

const NAV = [
  ["#/", "Oversikt", "home"], ["#/artister", "Artister", "artists"], ["#/samling", "Samling", "vinyl"], ["#/mangler", "Mangler", "missing"], ["#/mer", "Mer", "more"],
];
const SIDE_EXTRA = [["#/onsker", "⭐", "Ønskeliste"], ["#/favoritter", "❤️", "Favoritter"], ["#/data", "💾", "Data og backup"]];
function drawNav(route){
  const top = "#/" + (route[0] || "");
  const active = h => h === top || (h === "#/artister" && top === "#/artist") || (h === "#/mer" && ["#/onsker","#/favoritter","#/data"].includes(top));
  const items = NAV.map(([h, t, i]) => `<a class="navbtn${active(h) ? " on" : ""}" href="${h}" ${active(h) ? 'aria-current="page"' : ""}>${IC[i]}<span>${t}</span></a>`).join("");
  $("#bottom").innerHTML = items;
  $("#side").innerHTML = `<a class="brand" href="#/">${discSvg()}Vinyl Vault</a><div class="lockbar" id="sideLock"></div>` + NAV.slice(0, 4).map(([h, t, i]) =>
      `<a class="navbtn${active(h) ? " on" : ""}" href="${h}">${IC[i]}<span>${t}</span></a>`).join("") + '<div class="sep"></div>' +
    SIDE_EXTRA.map(([h, e, t]) => `<a class="navbtn${top === h ? " on" : ""}" href="${h}"><span style="width:22px;text-align:center">${e}</span><span>${t}</span></a>`).join("") +
    `<div class="foot">Vinyl Vault v${APP_VERSION}</div>`;
  drawLock();
}

const ui = { // husker valg mens appen er åpen
  artists: { q: "", sort: "navn" },
  samling: { q: "", sort: "artist", status: "eier", artists: [] },
  mangler: { q: "" },
};
let charts = [];
function route(){
  charts.forEach(c => { try{ c.destroy(); }catch(e){} }); charts = [];
  if (/^#\/samling\?kjop/.test(location.hash)) { ui.samling.sort = "kjop"; ui.samling.status = "eier"; history.replaceState(null, "", "#/samling"); }
  const parts = location.hash.split("?")[0].replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  let [r, id] = parts;
  drawNav(parts);
  const V = $("#view");
  let html;
  if (loadState !== "ok") r = "__" + loadState;
  switch (r){
    case "__loading": html = `<div class="loading">${discSvg()}<p>Henter samlingen …</p></div>`; break;
    case "__error": html = `<div class="empty glass">${IC.missing}<p>Fikk ikke hentet samlingen.<br><span class="muted">${esc(loadError)}</span></p><button class="btn pri" data-act="reload">Prøv igjen</button></div>`; break;
    case "": case undefined: html = viewDashboard(); break;
    case "artister": html = viewArtists(); break;
    case "artist": html = artist(id) ? viewArtist(id) : notFound(); break;
    case "album": html = album(id) ? viewAlbum(id) : notFound(); break;
    case "samling": html = viewCollection(); break;
    case "mangler": html = viewMissing(); break;
    case "onsker": html = viewList("onsker"); break;
    case "favoritter": html = viewList("favoritter"); break;
    case "mer": html = viewMore(); break;
    case "data": html = viewData(); break;
    default: html = notFound();
  }
  V.innerHTML = `<div class="view">${html}</div>`;
  if (html !== notFound()) after[r || ""]?.(id);   // ikke tegn detaljer for noe som ikke finnes (f.eks. etter import)
  document.title = (r === "album" && album(id) ? album(id).title + " – " : r === "artist" && artist(id) ? artist(id).name + " – " : "") + "Vinyl Vault";
}
/* tegner på nytt uten å hoppe til toppen */
function refresh(){ const y = scrollY; route(); scrollTo(0, y); }
const notFound = () => `<div class="empty glass">${IC.missing}<p>Fant ikke siden. Den kan ha blitt slettet.</p><a class="btn" href="#/">Til oversikten</a></div>`;
const after = {};

/* =====================================================================
   BYGGEKLOSSER
   ===================================================================== */
function albumCard(a, i, opts = {}){
  const badges = (a.favorite ? "<span title='Favoritt'>❤️</span>" : "") + (a.wishlist && !a.owned ? "<span title='Ønskeliste'>⭐</span>" : "");
  return `<a class="card glass${a.owned ? "" : " missing"}" href="#/album/${a.id}" style="--i:${i}">
    <div class="cover">${coverHtml(a)}</div>
    ${badges ? `<div class="badges">${badges}</div>` : ""}
    <button class="status" data-toggle="${a.id}" aria-label="${a.owned ? "Eier – trykk for å sette som mangler" : "Mangler – trykk for å sette som eid"}" title="${a.owned ? "Eier" : "Mangler"}">${a.owned ? "✅" : "❌"}</button>
    <div class="t">${esc(a.title)}</div>
    <div class="y">${opts.showArtist ? esc(artistName(a.artistId)) + " · " : ""}${a.year || "–"}</div>
  </a>`;
}
function thumbRow(a, end, btn){
  return `<a class="row" href="#/album/${a.id}"><div class="thumb">${coverHtml(a)}</div>
    <div class="rt"><b>${esc(a.title)}</b><span>${esc(artistName(a.artistId))}${a.year ? " · " + a.year : ""}</span></div>
    ${end ? `<span class="end">${end}</span>` : ""}${btn || ""}</a>`;
}
function mosaic(id){
  const l = albumsOf(id).filter(a => a.owned).concat(albumsOf(id).filter(a => !a.owned)).slice(0, 4);
  return `<div class="mosaic">${[0,1,2,3].map(k => `<div>${l[k] ? coverHtml(l[k]) : ""}</div>`).join("")}</div>`;
}
function ringSvg(p){
  const r = 46, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${p === 100 ? "#34d399" : "url(#rg)"}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" style="transition:stroke-dashoffset .8s"/>
    <defs><linearGradient id="rg"><stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#ff6b3d"/></linearGradient></defs></svg>`;
}
const progress = p => `<div class="bar${p === 100 ? " full" : ""}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
const emptyBox = (msg, btn = "") => `<div class="empty glass">${IC.vinyl}<p>${msg}</p>${btn}</div>`;

/* =====================================================================
   9. DASHBOARD
   ===================================================================== */
function viewDashboard(){
  const t = totals();
  const recent = db.albums.filter(a => a.owned && a.purchaseDate).sort((a, b) => b.purchaseDate.localeCompare(a.purchaseDate)).slice(0, 10);
  const best = db.artists.map(a => ({ a, s: artistStats(a.id) })).filter(x => x.s.total).sort((x, y) => y.s.pct - x.s.pct || y.s.own - x.s.own).slice(0, 5);
  const favs = db.albums.filter(a => a.favorite);
  const wish = db.albums.filter(a => a.wishlist && !a.owned);
  return `
  <div class="head"><div><h1>Samlingen din</h1><p class="sub">${t.own} plater i hylla · ${t.miss} på jakt etter</p></div></div>
  <div class="stats stag">
    <div class="stat glass hl" style="--i:0"><div class="k">Komplett</div><div class="v">${t.pct} %</div>${progress(t.pct)}</div>
    <div class="stat glass" style="--i:1"><div class="k">Album totalt</div><div class="v">${t.total}</div></div>
    <div class="stat glass" style="--i:2"><div class="k">Artister</div><div class="v">${t.artists}</div></div>
    <div class="stat glass" style="--i:3"><div class="k">Eier</div><div class="v" style="color:var(--ok)">${t.own}</div></div>
    <div class="stat glass" style="--i:4"><div class="k">Mangler</div><div class="v" style="color:var(--miss)">${t.miss}</div></div>
    <div class="stat glass" style="--i:5"><div class="k">Samlingsverdi</div><div class="v">${nok(t.value)}</div></div>
  </div>

  <div class="section"><div class="sh"><h2>Siste innkjøp</h2><a class="link" href="#/samling?kjop">Se alle</a></div>
    ${recent.length ? `<div class="hscroll stag">${recent.map((a, i) => albumCard(a, i, { showArtist: true })).join("")}</div>` : emptyBox("Ingen kjøpsdatoer registrert ennå.")}
  </div>

  <div class="section two">
    <div class="group glass"><h3>Mest komplette artister <a class="link" href="#/artister">Alle</a></h3>
      ${best.length ? best.map((x, i) => `<a class="rank" href="#/artist/${x.a.id}"><span class="no">${i + 1}</span>
        <div class="nm"><b>${esc(x.a.name)}</b><span class="muted" style="font-size:.8rem">${x.s.own} av ${x.s.total} album</span>${progress(x.s.pct)}</div>
        <span class="p">${x.s.pct} %</span></a>`).join("") : '<p class="muted">Ingen artister ennå.</p>'}
    </div>
    <div class="group glass"><h3>Ønskeliste <a class="link" href="#/onsker">${wish.length} album</a></h3>
      ${wish.length ? wish.slice(0, 5).map(a => thumbRow(a, "⭐")).join("") : '<p class="muted" style="margin:4px">Tom. Trykk ⭐ på et album du mangler.</p>'}
    </div>
  </div>

  ${favs.length ? `<div class="section"><div class="sh"><h2>Favorittalbum</h2><a class="link" href="#/favoritter">Se alle</a></div>
    <div class="hscroll stag">${favs.map((a, i) => albumCard(a, i, { showArtist: true })).join("")}</div></div>` : ""}

  <div class="section"><div class="sh"><h2>Statistikk</h2></div>
    <div class="charts">
      <div class="chartbox glass"><h3>Album per artist</h3><div class="cv"><canvas id="ch1"></canvas></div></div>
      <div class="chartbox glass"><h3>Album per tiår</h3><div class="cv"><canvas id="ch2"></canvas></div></div>
      <div class="chartbox glass"><h3>Eier vs mangler</h3><div class="cv"><canvas id="ch3"></canvas></div></div>
      <div class="chartbox glass"><h3>Topp 10 artister (eide plater)</h3><div class="cv"><canvas id="ch4"></canvas></div></div>
    </div>
  </div>`;
}
after[""] = () => drawCharts();

function drawCharts(tries = 0){
  if (typeof Chart === "undefined"){
    if (tries < 25) return void setTimeout(() => { if (document.getElementById("ch1")) drawCharts(tries + 1); }, 200);
    document.querySelectorAll(".cv").forEach(c => c.outerHTML = '<p class="nochart">Diagrammer krever nett første gang (Chart.js lastes fra cdnjs).</p>');
    return;
  }
  if (!document.getElementById("ch1")) return;
  Chart.defaults.color = "#9aa3b2"; Chart.defaults.font.family = "Inter, system-ui, sans-serif"; Chart.defaults.borderColor = "rgba(255,255,255,.08)";
  const OWN = "#34d399", MISS = "rgba(248,113,113,.75)", ACC = "#f5a524";
  const arts = sortedArtists().map(a => ({ a, s: artistStats(a.id) }));
  const base = { responsive: true, maintainAspectRatio: false, animation: { duration: 700 }, plugins: { legend: { labels: { boxWidth: 12, usePointStyle: true } } } };
  charts.push(new Chart(document.getElementById("ch1"), { type: "bar",
    data: { labels: arts.map(x => x.a.name), datasets: [
      { label: "Eier", data: arts.map(x => x.s.own), backgroundColor: OWN, borderRadius: 6 },
      { label: "Mangler", data: arts.map(x => x.s.miss), backgroundColor: MISS, borderRadius: 6 }] },
    options: { ...base, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } } }));
  const dec = {};
  db.albums.forEach(a => { if (!a.year) return; const d = Math.floor(a.year / 10) * 10; dec[d] = dec[d] || { own: 0, miss: 0 }; dec[d][a.owned ? "own" : "miss"]++; });
  const decs = Object.keys(dec).map(Number).sort((a, b) => a - b);
  charts.push(new Chart(document.getElementById("ch2"), { type: "bar",
    data: { labels: decs.map(d => d + "-tallet"), datasets: [
      { label: "Eier", data: decs.map(d => dec[d].own), backgroundColor: OWN, borderRadius: 6 },
      { label: "Mangler", data: decs.map(d => dec[d].miss), backgroundColor: MISS, borderRadius: 6 }] },
    options: { ...base, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } } }));
  const t = totals();
  charts.push(new Chart(document.getElementById("ch3"), { type: "doughnut",
    data: { labels: ["Eier", "Mangler"], datasets: [{ data: [t.own, t.miss], backgroundColor: [OWN, MISS], borderColor: "#12151d", borderWidth: 3, hoverOffset: 8 }] },
    options: { ...base, cutout: "68%", plugins: { ...base.plugins, legend: { position: "bottom", labels: { boxWidth: 12, usePointStyle: true } } } } }));
  const top = [...arts].sort((x, y) => y.s.own - x.s.own || y.s.pct - x.s.pct).slice(0, 10);
  charts.push(new Chart(document.getElementById("ch4"), { type: "bar",
    data: { labels: top.map(x => x.a.name), datasets: [{ label: "Eide plater", data: top.map(x => x.s.own), backgroundColor: ACC, borderRadius: 6 }] },
    options: { ...base, indexAxis: "y", plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } }, y: { grid: { display: false } } } } }));
}

function drawTracks(id, editing){
  const a = album(id), P = $("#trackPanel");
  P.innerHTML = editing
    ? `<div class="ph"><h2>Trackliste</h2></div>
       <textarea class="ta" id="trackTa" placeholder="Ett spor per linje">${esc(a.tracks.join("\n"))}</textarea>
       <p class="muted" style="font-size:.8rem;margin:6px 0 0">Ett spor per linje. Nummerering legges på automatisk.</p>
       <div class="btns" style="margin-top:10px;justify-content:flex-end"><button class="btn" data-tr="cancel">Avbryt</button><button class="btn pri" data-tr="save">Lagre</button></div>`
    : `<div class="ph"><h2>Trackliste</h2><button class="link edit-only" data-tr="edit">${a.tracks.length ? "Rediger" : "Legg inn"}</button></div>
       ${a.tracks.length ? `<ol class="tracks">${a.tracks.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : '<p class="muted">Ingen spor registrert.</p>' + (a.rgid ? '<button class="btn edit-only" data-tr="fetch">🔎 Hent trackliste fra MusicBrainz</button>' : "")}`;
  P.onclick = e => {
    const b = e.target.closest("[data-tr]"); if (!b) return;
    if (b.dataset.tr === "edit") { drawTracks(id, true); $("#trackTa").focus(); }
    if (b.dataset.tr === "fetch" && canEdit()) {
      b.disabled = true; b.innerHTML = '<span class="spin"></span>Henter …';
      mbTracks(a.rgid).then(t => {
        if (!t.length) { toast("MusicBrainz har ingen trackliste for dette albumet"); drawTracks(id, false); return; }
        a.tracks = t; save(); toast("Tracklisten er hentet"); refresh();
      }).catch(err => { toast(err.message); drawTracks(id, false); });
    }
    if (b.dataset.tr === "cancel") drawTracks(id, false);
    if (!canEdit()) return;
    if (b.dataset.tr === "save") { a.tracks = parseTracks($("#trackTa").value); save(); toast("Tracklisten er lagret"); refresh(); }
  };
}
function drawNotes(id, editing){
  const a = album(id), P = $("#notePanel");
  P.innerHTML = editing
    ? `<div class="ph"><h2>Notater</h2></div><textarea class="ta" id="noteTa" style="min-height:110px" placeholder="Pressing, kjøpested, minner …">${esc(a.notes)}</textarea>

    : `<div class="ph"><h2>Notater</h2><button class="link edit-only" data-nt="edit">${a.notes ? "Rediger" : "Skriv notat"}</button></div>
       ${a.notes ? `<p class="notes" style="margin:0">${esc(a.notes)}</p>` : '<p class="muted" style="margin:0">Ingen notater.</p>'}`;
  P.onclick = e => {
    const b = e.target.closest("[data-nt]"); if (!b) return;
    if (b.dataset.nt === "edit") { drawNotes(id, true); $("#noteTa").focus(); }
    if (b.dataset.nt === "cancel") drawNotes(id, false);
    if (!canEdit()) return;
    if (b.dataset.nt === "save") { a.notes = $("#noteTa").value.trim(); save(); toast("Notatet er lagret"); drawNotes(id, false); }
  };
}

const parseTracks = s => String(s).split(/\r?\n/).map(t => t.replace(/^\s*(?:\d{1,2}\s*[.):\-–]\s*|[A-D]\d{1,2}[.):\-–]?\s+)/i, "").trim()).filter(Boolean);

    (!q || norm([a.title, artistName(a.artistId), a.genre, a.year, a.notes, a.tracks.join(" ")].join(" ")).includes(q)));
  const ar = a => sortName(artistName(a.artistId));
  const cmp = {

    aarNy: (a, b) => (b.year || 0) - (a.year || 0) || byName(a.title, b.title),

let modalCleanup = null;
function openModal(html, onMount){
  const root = $("#modalRoot");
  if (modalCleanup) modalCleanup();
  root.innerHTML = `<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const m = $("#modal"), prev = document.activeElement;
  const cleanup = () => { document.removeEventListener("keydown", onKey); if (modalCleanup === cleanup) modalCleanup = null; };
  const close = () => { cleanup(); root.innerHTML = ""; prev && prev.focus && document.contains(prev) && prev.focus(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", onKey); modalCleanup = cleanup;
  onMount && onMount(m, close);
  const f = m.querySelector("input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea"); f && setTimeout(() => f.focus(), 60);
  return close;
}
function confirmBox(title, text, okText = "Slett", danger = true, cancelText = "Avbryt"){
  return new Promise(res => {
    let done = false;
    const close = openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
      <div class="acts"><button class="btn" data-close>${esc(cancelText)}</button><button class="btn ${danger ? "danger" : "pri"}" id="cOk">${esc(okText)}</button></div>`,
      (m, cl) => { m.querySelector("#cOk").onclick = () => { done = true; cl(); res(true); }; });
    const obs = new MutationObserver(() => { if (!$("#modal")) { obs.disconnect(); if (!done) res(false); } });
    obs.observe($("#modalRoot"), { childList: true });
  });
}

/* =====================================================================
   HENTE ALBUM AUTOMATISK – MusicBrainz (data) og Cover Art Archive (cover)
   Gratis og uten nøkkel. MusicBrainz tillater ca. 1 kall i sekundet, så alle kall går i kø.
   ===================================================================== */
const MB = "https://musicbrainz.org/ws/2";
const sleep = ms => new Promise(res => setTimeout(res, ms));
let mbNext = 0, mbChain = Promise.resolve();
function mb(path){
  const run = async () => {
    for (let tries = 0; ; tries++){
      const wait = mbNext - Date.now(); if (wait > 0) await sleep(wait);
      mbNext = Date.now() + 1100;
      let r;
      try{ r = await fetch(MB + path + (path.includes("?") ? "&" : "?") + "fmt=json", { headers: { Accept: "application/json" } }); }
      catch(e){ throw new Error("Fikk ikke kontakt med MusicBrainz. Sjekk nettet og prøv igjen."); }
      if ((r.status === 503 || r.status === 429) && tries < 3) { await sleep(2500 * (tries + 1)); continue; }
      if (!r.ok) throw new Error(r.status === 503 ? "MusicBrainz er travel akkurat nå. Prøv igjen om litt." : "MusicBrainz svarte " + r.status + ".");
      return r.json();
    }
  };
  const p = mbChain.then(run, run); mbChain = p.catch(() => {}); return p;
}
const caaCover = rgid => `https://coverartarchive.org/release-group/${rgid}/front-500`;
const titleCase = s => String(s || "").replace(/(^|[\s-])\S/g, c => c.toUpperCase());

async function mbSearchArtist(name){
  const q = encodeURIComponent(`artist:"${name.replace(/"/g, "")}"`);
  const j = await mb(`/artist?query=${q}&limit=8`);
  return (j.artists || []).map(a => ({ mbid: a.id, name: a.name, dis: a.disambiguation || "", country: a.country || "",
    begin: ((a["life-span"] || {}).begin || "").slice(0, 4), type: a.type || "", score: a.score || 0 }));
}
/* alle release groups av typen album, sortert etter første utgivelse */
async function mbAlbums(mbid){
  let out = [], offset = 0, total = 1;
  while (offset < total && offset < 500){
    const j = await mb(`/release-group?artist=${mbid}&type=album&limit=100&offset=${offset}`);
    const l = j["release-groups"] || [];
    total = j["release-group-count"] || 0;
    out = out.concat(l); offset += 100;
    if (!l.length) break;
  }
  return out.map(g => {
    const sec = (g["secondary-types"] || []).map(x => x.toLowerCase());
    const kind = !sec.length ? "studio" : sec.includes("live") ? "live" : sec.includes("compilation") ? "samle" : "annet";
    return { rgid: g.id, title: g.title, year: parseInt((g["first-release-date"] || "").slice(0, 4)) || null, kind, sec };
  }).sort((a, b) => (a.year || 9999) - (b.year || 9999) || byName(a.title, b.title));
}
async function mbGenre(mbid){
  try{
    const j = await mb(`/artist/${mbid}?inc=genres`);
    const g = (j.genres || []).sort((a, b) => (b.count || 0) - (a.count || 0))[0];
    return g ? titleCase(g.name) : "";
  }catch(e){ return ""; }
}
/* trackliste: velger helst en offisiell vinylutgave, ellers den eldste offisielle */
async function mbTracks(rgid){
  const j = await mb(`/release?release-group=${rgid}&status=official&inc=recordings+media&limit=25`);
  const rel = (j.releases || []).filter(x => (x.media || []).some(m => (m.tracks || []).length));
  if (!rel.length) return [];
  const isVinyl = x => (x.media || []).some(m => /vinyl/i.test(m.format || ""));
  const date = x => x.date || "9999";
  rel.sort((a, b) => (isVinyl(b) - isVinyl(a)) || date(a).localeCompare(date(b)));
  return rel[0].media.flatMap(m => (m.tracks || []).map(t => t.title || (t.recording || {}).title || "")).filter(Boolean);
}

/* tracklister hentes i bakgrunnen etter at albumene er lagt inn */
const trackQueue = [];
let trackRunning = false;
function queueTracks(ids){
  ids.forEach(id => { if (!trackQueue.includes(id)) trackQueue.push(id); });
  if (!trackRunning) runTrackQueue();
}
async function runTrackQueue(){
  trackRunning = true;
  let done = 0, total = trackQueue.length;
  while (trackQueue.length){
    const a = album(trackQueue.shift());
    if (!a || !a.rgid || a.tracks.length || !canEdit()) continue;
    try{
      const t = await mbTracks(a.rgid);
      if (t.length && album(a.id) && !a.tracks.length){ a.tracks = t; done++; save(); if (location.hash === "#/album/" + a.id) refresh(); }
    }catch(e){ /* albumsiden har en knapp for å prøve igjen */ }
  }
  trackRunning = false;
  if (total > 1) toast(`🎵 Tracklister hentet for ${done} av ${total} album`);
}

/* Flyt: velg riktig artist i MusicBrainz → velg album → legges inn som «Mangler» */
function fetchAlbumsFlow(artistId){
  const ar = artist(artistId); if (!ar || !canEdit()) return;
  const src = '<p class="src">Data fra <a href="https://musicbrainz.org" target="_blank" rel="noopener">MusicBrainz</a>, cover fra <a href="https://coverartarchive.org" target="_blank" rel="noopener">Cover Art Archive</a>.</p>';
  let cancelled = false;
  const close = openModal(`<h2>Hent album: ${esc(ar.name)}</h2><div id="mbBody"></div>`, () => {});
  const body = () => document.getElementById("mbBody");
  const gone = () => cancelled || !body();
  const busy = t => { if (!gone()) body().innerHTML = `<p class="muted"><span class="spin"></span>${t}</p><div class="acts"><button class="btn" data-close>Avbryt</button></div>`; };
  const fail = (msg, retry) => {
    if (gone()) return;
    body().innerHTML = `<p style="color:var(--miss)">${esc(msg)}</p>${src}<div class="acts"><button class="btn" data-close>Lukk</button><button class="btn pri" id="mbRetry">Prøv igjen</button></div>`;
    body().querySelector("#mbRetry").onclick = retry;
  };

  async function chooseArtist(){
    busy("Søker etter artisten i MusicBrainz …");
    let list;
    try{ list = await mbSearchArtist(ar.name); }catch(e){ return fail(e.message, chooseArtist); }
    if (gone()) return;
    if (!list.length) return fail(`Fant ingen artist som heter «${ar.name}» i MusicBrainz. Sjekk stavemåten under Rediger artist.`, chooseArtist);
    body().innerHTML = `<p class="muted">Velg riktig artist:</p><div class="pick">${list.map((x, i) => `<button class="opt" data-pick="${i}">
        <div><b>${esc(x.name)}</b><span>${esc([x.dis, x.type === "Group" ? "Band" : x.type === "Person" ? "Artist" : x.type, x.country, x.begin && "fra " + x.begin].filter(Boolean).join(" · ") || "Ingen detaljer")}</span></div></button>`).join("")}</div>
      ${src}<div class="acts"><button class="btn" data-close>Avbryt</button></div>`;
    body().querySelector(".pick").onclick = e => {
      const b = e.target.closest("[data-pick]"); if (!b) return;
      ar.mbid = list[+b.dataset.pick].mbid; save(); chooseAlbums();
    };
  }

  async function chooseAlbums(){
    busy("Henter albumene …");
    let list, genre;
    try{ list = await mbAlbums(ar.mbid); genre = await mbGenre(ar.mbid); }catch(e){ return fail(e.message, chooseAlbums); }
    if (gone()) return;
    const mine = albumsOf(ar.id);
    const have = x => mine.some(a => a.rgid === x.rgid || norm(a.title) === norm(x.title));
    if (!list.length) return fail("MusicBrainz har ingen album registrert for denne artisten.", chooseAlbums);
    // album du allerede har registrert får cover og trackliste når de finnes i MusicBrainz
    const linked = [];
    list.forEach(x => { const a = mine.find(y => !y.rgid && norm(y.title) === norm(x.title)); if (a){ a.rgid = x.rgid; if (!a.cover) a.cover = caaCover(x.rgid); linked.push(a.id); } });
    if (linked.length){ save(); queueTracks(linked); }
    const groups = [["studio", "Studioalbum", true], ["live", "Livealbum", false], ["samle", "Samlealbum", false], ["annet", "Annet (soundtrack, remiks …)", false]];
    const row = (x, on) => { const h = have(x);
      return `<label class="opt${h ? " have" : ""}"><input type="checkbox" data-rg="${x.rgid}"${h ? " disabled" : on ? " checked" : ""}>
        <div class="th"><img src="${caaCover(x.rgid).replace("-500", "-250")}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></div>
        <div><b>${esc(x.title)}</b><span>${x.year || "Ukjent år"}${h ? " · finnes allerede" : ""}</span></div></label>`; };
    body().innerHTML = `<p class="muted" style="margin-top:0">Avkryssede album legges inn som <b style="color:var(--ink)">❌ Mangler</b>. Marker etterpå de du eier.</p>
      ${linked.length ? `<p class="muted" style="font-size:.85rem">✓ ${linked.length} album du allerede har er koblet til MusicBrainz og får cover og trackliste.</p>` : ""}
      <div class="pick">${groups.map(([k, t, on]) => { const l = list.filter(x => x.kind === k); return l.length ? `<h3>${t} (${l.length})<button type="button" class="link" data-all="${k}">Velg alle</button></h3>${l.map(x => row(x, on)).join("")}` : ""; }).join("")}</div>
      ${src}<div class="acts"><button class="btn" data-close>Avbryt</button><button class="btn pri" id="mbAdd"></button></div>`;
    const B = body(), btn = B.querySelector("#mbAdd");
    const count = () => { const n = B.querySelectorAll("input[data-rg]:checked").length; btn.textContent = n ? `Legg til ${n} album` : "Velg album"; btn.disabled = !n; };
    B.addEventListener("change", count); count();
    B.querySelectorAll("[data-all]").forEach(b => b.onclick = () => {
      const boxes = list.filter(x => x.kind === b.dataset.all).map(x => B.querySelector(`input[data-rg="${x.rgid}"]`)).filter(i => !i.disabled);
      const all = boxes.every(i => i.checked); boxes.forEach(i => i.checked = !all); count();
    });
    btn.onclick = () => {
      const pickIds = [...B.querySelectorAll("input[data-rg]:checked")].map(i => i.dataset.rg);
      const added = list.filter(x => pickIds.includes(x.rgid)).map(x => blankAlbum({ artistId: ar.id, title: x.title, year: x.year, rgid: x.rgid,
        cover: caaCover(x.rgid), genre: x.kind === "live" ? (genre ? genre + " · Live" : "Live") : genre, owned: false }));
      db.albums.push(...added); save(); close(); refresh();
      toast(`${added.length} album lagt til – tracklister hentes i bakgrunnen`);
      queueTracks(added.map(a => a.id));
    };
  }

  // lukkes vinduet, stoppes flyten
  const obs = new MutationObserver(() => { if (!document.getElementById("mbBody")) { cancelled = true; obs.disconnect(); } });
  obs.observe($("#modalRoot"), { childList: true });
  ar.mbid ? chooseAlbums() : chooseArtist();
}

const EDIT_ACTS = new Set(["fetchAlbums", "newArtist", "editArtist", "newAlbum", "editAlbum", "delAlbum", "delArtist", "backup", "restore", "loadDemo", "wipe"]);
document.addEventListener("click", async e => {
  if (!canEdit() && e.target.closest("[data-toggle],[data-flagrow],[data-set],[data-flag]")) return;
  const tg = e.target.closest("[data-toggle]");
  if (tg) { e.preventDefault(); e.stopPropagation();
    const a = album(tg.dataset.toggle); if (!a) return;
    setOwned(a.id, !a.owned); tg.classList.add("pop"); setTimeout(refresh, 180); return; }
  const fr = e.target.closest("[data-flagrow]");
  if (fr) { e.preventDefault(); e.stopPropagation(); toggleFlag(fr.dataset.flagrow, "wishlist"); refresh(); return; }
  const st = e.target.closest("[data-set]");
  if (st) { const a = album(st.dataset.set), own = st.dataset.own === "1"; if (a && a.owned !== own) { setOwned(a.id, own); refresh(); } return; }
  const fl = e.target.closest("[data-flag]");
  if (fl) { toggleFlag(fl.dataset.id, fl.dataset.flag); refresh(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (EDIT_ACTS.has(act) && !canEdit()) return;
  if (act === "lock"){
    if (!canEdit()) return unlockForm();
    if (await confirmBox("Låse redigering?", "Nøkkelen fjernes fra denne enheten." + (sync.dirty ? " NB: Siste endring er ikke lagret på GitHub ennå." : ""), "Lås", false)) lockOut();
    return;
  }
  if (act === "retrySync") return void pushNow();
  if (act === "reload") { loadState = "loading"; route(); return void load(); }
  if (act === "fetchAlbums") fetchAlbumsFlow(id);
  if (act === "newArtist") artistForm();
  if (act === "editArtist") artistForm(id);
  if (act === "newAlbum") albumForm(null, b.dataset.artist);
  if (act === "editAlbum") albumForm(id);
  if (act === "delAlbum"){
    const a = album(id); if (!a) return;
    if (await confirmBox("Slette album?", `«${a.title}» av ${artistName(a.artistId)} slettes for godt.`)){
      $("#modalRoot").innerHTML = "";
      db.albums = db.albums.filter(x => x.id !== id); save(); toast("Albumet er slettet");
      if (location.hash.startsWith("#/album/")) location.hash = "#/artist/" + a.artistId; else refresh();
    }
  }
  if (act === "delArtist"){
    const a = artist(id); if (!a) return; const n = albumsOf(id).length;
    if (await confirmBox("Slette artist?", `${a.name} og ${n} ${n === 1 ? "album" : "album"} slettes for godt.`)){
      db.artists = db.artists.filter(x => x.id !== id); db.albums = db.albums.filter(x => x.artistId !== id); save();
      toast(`${a.name} er slettet`); location.hash = "#/artister";
    }
  }
  if (act === "export") exportJson();
  if (act === "backup") { doBackup(); refresh(); }
  if (act === "restore"){
    const bk = readBackup(); if (!bk) return;
    if (await confirmBox("Gjenopprette backup?", `Samlingen erstattes med backupen fra ${new Date(bk.date).toLocaleString("nb-NO")} (${bk.data.albums.length} album).`, "Gjenopprett", false)){
      try{ db = validate(bk.data); save(); toast("Backupen er gjenopprettet"); refresh(); }catch(err){ toast("Backupen er skadet"); }
    }
  }
  if (act === "loadDemo"){
    if (await confirmBox("Laste inn eksempeldata?", "Samlingen erstattes med eksempeldataene. En backup tas først.", "Last inn", false)){ doBackup(true); db = seed(); save(); toast("Eksempeldata lastet inn"); refresh(); }
  }
  if (act === "wipe"){
    if (await confirmBox("Slette alt?", "Alle artister og album slettes. En backup tas først, så du kan angre under «Gjenopprett backup».", "Slett alt")){ doBackup(true); db = { version: 1, artists: [], albums: [] }; save(); toast("Samlingen er tømt"); refresh(); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("label.btn")) e.target.querySelector("input")?.click(); });

/* pluss-knappen: nytt album (med artisten du står på) – ny artist hvis ingen finnes */
$("#fab").addEventListener("click", () => {
  if (!canEdit()) return;
  if (!db.artists.length) return artistForm();
  const m = location.hash.match(/^#\/artist\/(.+)$/), am = location.hash.match(/^#\/album\/(.+)$/);
  albumForm(null, m ? decodeURIComponent(m[1]) : am && album(decodeURIComponent(am[1])) ? album(decodeURIComponent(am[1])).artistId : "");
});

let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

/* oppdater hvis samlingen endres i en annen fane */
addEventListener("storage", e => {
  if (e.key === CACHE_KEY) { const d = readCache(); if (d) { db = d; refresh(); } }
  if (e.key === TOKEN_KEY) { token = ls.get(TOKEN_KEY) || ""; drawLock(); refresh(); }
});
/* lagre med en gang hvis appen lukkes eller legges i bakgrunnen */
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && sync.dirty && canEdit()) pushNow(); });
addEventListener("online", () => { if (sync.dirty && canEdit()) pushNow(); });

/* ---------- start ---------- */
$("#brandDisc").outerHTML = discSvg();
addEventListener("hashchange", () => { route(); scrollTo({ top: 0 }); });
drawLock();
load();
</script>
