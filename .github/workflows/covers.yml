# Lagrer coverbilder i repoet hver gang samlingen endres, så appen kan vise dem raskt fra GitHub Pages.
# Kan også kjøres for hånd: Actions → Lagre cover → Run workflow.
name: Lagre cover

on:
  push:
    branches: [main]
    paths: [collection.json, scripts/fetch-covers.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hent cover som mangler
        run: node scripts/fetch-covers.mjs
      - name: Lagre i repoet
        run: |
          git add covers
          if git diff --cached --quiet; then echo "Ingen nye cover."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lagre coverbilder"
          # appen kan ha lagret samlingen i mellomtiden: hent og prøv igjen
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
